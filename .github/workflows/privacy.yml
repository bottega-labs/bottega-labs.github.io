name: privacy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: ruby scripts/check-privacy.rb
      - run: bundle exec jekyll build
      - run: ruby scripts/check-privacy.rb --site _site
